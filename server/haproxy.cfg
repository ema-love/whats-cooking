# HAProxy config for lb-01

global
    daemon

defaults
    mode http
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend whats_cooking
    bind *:80
    default_backend web_servers

# Take turns between the two servers; skip a server that stops answering
backend web_servers
    balance roundrobin
    option httpchk GET /
    server web-01 3.8.117.215:80 check
    server web-02 18.170.32.150:80 check