# Nginx config for web-01 and web-02

# Cache API answers to save the daily API allowance
proxy_cache_path /var/cache/nginx/whats-cooking keys_zone=api_cache:10m inactive=24h;

server {
    listen 80 default_server;
    root /var/www/whats-cooking;
    index index.html;

    # Shows which server answered (to test the load balancer)
    add_header X-Served-By $hostname always;

    # Hide .env, .git and the server folder
    location ~ /\. { return 404; }
    location /server/ { return 404; }

    # API proxy: adds the secret key, so it never reaches the browser
    location /api/recipes/ {
        limit_except GET { deny all; }
        proxy_pass https://api.spoonacular.com/recipes/;
        proxy_ssl_server_name on;
        include /etc/nginx/snippets/spoonacular-key.conf;
        proxy_cache api_cache;
        proxy_cache_valid 200 1h;
        add_header X-Served-By $hostname always;
    }
}